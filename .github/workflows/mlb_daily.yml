name: MLB Daily Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r mlb_v4/requirements_v4.txt

      - name: Set dates
        run: |
          echo "REPORT_DATE=$(date -u +%F)" >> $GITHUB_ENV
          echo "TRAIN_END=$(date -u -d 'yesterday' +%F)" >> $GITHUB_ENV

      - name: Build live odds slate shell
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          ODDSPAPI_BOOKMAKER: pinnacle
          REPORT_DATE: ${{ env.REPORT_DATE }}
        run: |
          python mlb_automation/build_live_slate.py \
            --output mlb_automation/live_slate.json

      - name: Collect historical MLB games for V4.1
        run: |
          python mlb_v4/historical_collector.py \
            --start 2024-03-01 \
            --end $TRAIN_END

      - name: Build V4.1 features
        run: |
          python mlb_v4/feature_builder.py

      - name: Train V4.1 moneyline model
        run: |
          python mlb_v4/train_moneyline.py

      - name: Train V4.1 totals model
        run: |
          python mlb_v4/train_totals.py

      - name: Score today's slate with V4.1
        run: |
          python mlb_v4/score_today.py --date $REPORT_DATE

      - name: Merge V4.1 predictions into live slate
        run: |
          python mlb_automation/merge_v41_into_live_slate.py \
            --v41 mlb_v4/output/today_predictions.json \
            --live mlb_automation/live_slate.json \
            --output mlb_automation/final_scoring_slate.json

      - name: Push predictions to Supabase app database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REPORT_DATE: ${{ env.REPORT_DATE }}
        run: |
          python mlb_automation/push_to_supabase.py \
            --input mlb_automation/final_scoring_slate.json \
            --game-date "$REPORT_DATE" \
            --model-version V4.1

      - name: Run daily report
        run: |
          python mlb_automation/run_daily.py \
            --input mlb_automation/final_scoring_slate.json \
            --output mlb_automation/report_${{ github.run_id }}.md

      - name: Convert report to PDF
        run: |
          python mlb_automation/report_to_pdf.py \
            mlb_automation/report_${{ github.run_id }}.md \
            mlb_automation/report_${{ github.run_id }}.pdf

      - name: Send report email as PDF
        env:
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: 465
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SUBJECT: MLB Daily Model Report (PDF)
        run: |
          python mlb_automation/send_email.py \
            mlb_automation/report_${{ github.run_id }}.pdf \
            --body-file mlb_automation/report_${{ github.run_id }}.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-report
          path: |
            mlb_automation/live_slate.json
            mlb_automation/final_scoring_slate.json
            mlb_automation/supabase_push_summary.json
            mlb_automation/report_${{ github.run_id }}.md
            mlb_automation/report_${{ github.run_id }}.pdf
            mlb_v4/output/today_predictions.json
            mlb_v4/models/moneyline_meta.json
            mlb_v4/models/totals_meta.json
