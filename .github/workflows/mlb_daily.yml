name: MLB Daily Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
    - cron: '30 16 * * *'

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily report
        run: |
          python mlb_automation/run_daily.py \
            --input mlb_automation/sample_slate.json \
            --output mlb_automation/report_${{ github.run_id }}.md

      - name: Send report email
        env:
          EMAIL_HOST: smtp.gmail.com
          EMAIL_PORT: 465
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SUBJECT: MLB Daily Model Report
        run: |
          python mlb_automation/send_email.py mlb_automation/report_${{ github.run_id }}.md

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlb-daily-report
          path: mlb_automation/report_${{ github.run_id }}.md
