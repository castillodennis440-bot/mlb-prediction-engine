name: MLB Model Metrics

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      as_of:
        description: 'Compute as-of date (YYYY-MM-DD, leave blank for today UTC)'
        required: false
        default: ''
        type: string

jobs:
  compute-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Compute model metrics
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python mlb_automation/compute_model_metrics.py --as-of "${{ inputs.as_of || '' }}"

      - name: Upload metrics summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlb-model-metrics
          path: mlb_automation/model_metrics_summary.json
